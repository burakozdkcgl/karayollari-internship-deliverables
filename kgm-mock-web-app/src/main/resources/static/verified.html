<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f0a07;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #291203 0%, #170b04 50%, #0f0a07 100%);
        }

        .welcome-card {
            border: 1px solid rgba(226, 226, 229, 0.2);
            padding: 50px 70px;
            text-align: center;
            background: rgba(23, 11, 4, 0.6);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .welcome-title {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #e2e2e5;
        }

        .welcome-name {
            font-weight: 700;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1 class="welcome-title">giriş yaptınız <span class="welcome-name" id="userName">İsim</span>!</h1>
    </div>

    <script>
        // Sayfa yüklendiğinde oturum açan kullanıcının ismini API'den çeker
        window.addEventListener('DOMContentLoaded', () => {
            fetch('/api/user-info')
                .then(response => response.text())
                .then(name => {
                    if (name && name.trim() !== '') {
                        document.getElementById('userName').textContent = name;
                    } else {
                        window.location.href = '/index.html';
                    }
                })
                .catch(() => {
                    window.location.href = '/index.html';
                });
        });
    </script>
</body>
</html>
