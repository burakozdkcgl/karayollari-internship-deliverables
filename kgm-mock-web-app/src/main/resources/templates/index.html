<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGM Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .hidden {
            display: none !important;
        }

        /* Fixed container height prevents form layout shift */
        .error-container {
            min-height: 24px;
            margin-bottom: 10px;
        }

        /* White error text with shake animation */
        .error-message {
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: inline-block;
            animation: shake 0.4s ease-in-out;
        }

        /* Subtle horizontal shake keyframes */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND EFFECT -->
    <div class="highway-lines"></div>

    <!-- MAIN HERO SECTION -->
    <section class="hero-section">
        <div class="hero-wrapper animate-fade-in">
            
            <!-- Left Side -->
            <div class="hero-left">
                <!-- Portal Title (Visible by default) -->
                <h1 class="main-title" id="mainTitle">General <br> Directorate of <br> Highways</h1>

                <!-- Login Form (Hidden by default) -->
                <form action="/login" method="post" id="loginForm" class="hidden" style="max-width: 320px; margin-bottom: 25px;">
                    
                    <!-- Error message container above inputs -->
                    <div class="error-container">
                        <div id="errorLabel" class="error-message hidden">Invalid credentials!</div>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: #a0a0a5;">Username</label>
                        <input type="text" name="username" required autocomplete="off" style="width: 100%; padding: 12px; background: #0f0a07; border: 1px solid rgba(226, 226, 229, 0.2); color: #fff; outline: none;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: #a0a0a5;">Password</label>
                        <input type="password" name="password" required style="width: 100%; padding: 12px; background: #0f0a07; border: 1px solid rgba(226, 226, 229, 0.2); color: #fff; outline: none;">
                    </div>
                </form>

                <!-- Button Group -->
                <div class="button-group">
                    <button type="button" class="btn btn-primary" id="actionBtn" onclick="handleAction()">Sign In</button>
                    <button type="button" class="btn btn-secondary" id="secondaryBtn" onclick="handleSecondaryAction()">Register</button>
                </div>
            </div>

            <!-- Right Side (Non-draggable Logo) -->
            <div class="hero-right">
                <img src="/images/KGM_logo.png" alt="KGM Logo" class="logo" draggable="false">
            </div>

        </div>

        <!-- MINIMALIST CORNER COPYRIGHT -->
        <div class="corner-footer">
            &copy; 2026 heyoslmnbr
        </div>
    </section>

    <script>
        let isFormState = false;

        const mainTitle = document.getElementById('mainTitle');
        const loginForm = document.getElementById('loginForm');
        const actionBtn = document.getElementById('actionBtn');
        const secondaryBtn = document.getElementById('secondaryBtn');
        const errorLabel = document.getElementById('errorLabel');

        // Check URL parameters for login error on page load
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === 'INVALID_CREDENTIALS') {
                // Keep form visible
                isFormState = true;
                mainTitle.classList.add('hidden');
                loginForm.classList.remove('hidden');
                secondaryBtn.textContent = 'Back';
                
                // Show error message
                errorLabel.classList.remove('hidden');
            }
        });

        function handleAction() {
            if (!isFormState) {
                // Switch to form state on first click
                isFormState = true;
                mainTitle.classList.add('hidden');
                loginForm.classList.remove('hidden');
                secondaryBtn.textContent = 'Back';
            } else {
                // Submit form when inputs are visible
                loginForm.submit();
            }
        }

        function handleSecondaryAction() {
            if (isFormState) {
                // Return to title state and hide error
                isFormState = false;
                mainTitle.classList.remove('hidden');
                loginForm.classList.add('hidden');
                errorLabel.classList.add('hidden');
                secondaryBtn.textContent = 'Register';
            } else {
                // Handle registration redirection if needed
                console.log("Register clicked");
            }
        }
    </script>
</body>
</html>
